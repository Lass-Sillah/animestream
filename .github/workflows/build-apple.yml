name: Build Apple

# Builds the macOS app (ad-hoc signed, runs locally after clearing quarantine)
# and compiles iOS without signing to catch build errors.
on:
  workflow_dispatch:
  push:
    branches:
      - apple-port

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --dart-define-from-file=.env

      - name: Zip app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/animestream.app animestream-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: animestream-macos
          path: animestream-macos.zip
          retention-days: 14

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" > .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "COMMENTUM_API_URL=$COMMENTUM_API_URL" >> .env
          echo "DISCORD_APP_ID=$DISCORD_APP_ID" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env
